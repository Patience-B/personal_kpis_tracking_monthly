    .summary-card .label {

    .status-pill.complete {
      background: #e9f8f2;
      color: var(--hit);
    }

    .status-pill.in_progress {
      background: #fff7df;

    }

    .status-pill.pending {
      background: #f1f3f5;
      color: var(--muted);
    }

    .kpi-row {
      margin-bottom: 16px;

    ───────────────────────────── */

      max-width: 1100px;

    .legend-item {

      width: 7px;

    }

    /* ─────────────────────────────
       Responsive
    ───────────────────────────── */

    @media (max-width: 800px) {
      .summary-strip {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 16px 48px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;

      .year-badge {
        font-size: 1.8rem;
      }

      .summary-strip {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .summary-card {
        padding: 15px;
      }

      .summary-card .value {
        font-size: 1.5rem;
      }

      .months-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    // 120 minutes actual against a 120-minute cap = 100%.
    // 60 minutes actual = 200%.

      return Math.min(
        200,
        Math.round((cap / actual) * 100)
      );
    };
