<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Personal KPIs</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181c27;
      --surface2:  #1f2435;
      --border:    #2a2f42;
      --text:      #e4e8f0;
      --muted:     #7a82a0;
      --steps:     #4ade9a;
      --screen:    #f87171;
      --verses:    #a78bfa;
      --sand:      #60a5fa;
      --hit:       #4ade9a;
      --miss:      #f87171;
      --progress:  #fbbf24;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 24px 64px;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .header-left h1 {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-left p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .year-badge {
      font-family: 'DM Mono', monospace;
      font-size: 2.6rem;
      font-weight: 500;
      color: var(--muted);
      opacity: 0.35;
      line-height: 1;
    }

    /* ── Summary strip ── */
    .summary-strip {
      max-width: 1100px;
      margin: 0 auto 40px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .summary-card .metric-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .summary-card .label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
    }

    .summary-card .value {
      font-family: 'DM Mono', monospace;
      font-size: 1.8rem;
      font-weight: 500;
      line-height: 1;
    }

    .summary-card .sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Month grid ── */
    .months-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .month-card.in-progress {
      border-color: var(--progress);
      box-shadow: 0 0 0 1px var(--progress) inset, 0 0 20px -8px var(--progress);
    }

    .month-card.pending {
      opacity: 0.38;
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .month-name {
      font-family: 'DM Mono', monospace;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .status-pill {
      font-size: 0.68rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 100px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-pill.complete   { background: rgba(74,222,154,0.12); color: var(--hit); }
    .status-pill.in_progress{ background: rgba(251,191,36,0.15); color: var(--progress); }
    .status-pill.pending    { background: rgba(122,130,160,0.12); color: var(--muted); }

    /* ── KPI rows ── */
    .kpi-row {
      margin-bottom: 14px;
    }

    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .kpi-name {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kpi-name .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .kpi-pct {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .kpi-bar-track {
      height: 5px;
      background: var(--surface2);
      border-radius: 100px;
      overflow: hidden;
    }

    .kpi-bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
    }

    .kpi-raw {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
      font-family: 'DM Mono', monospace;
    }

    .kpi-null {
      height: 5px;
      background: var(--surface2);
      border-radius: 100px;
    }

    /* ── Legend ── */
    .legend {
      max-width: 1100px;
      margin: 32px auto 0;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    /* ── Section title ── */
    .section-title {
      max-width: 1100px;
      margin: 0 auto 16px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .section-gap { max-width: 1100px; margin: 0 auto; height: 1px; background: var(--border); margin-bottom: 32px; }

    @media (max-width: 640px) {
      .summary-strip { grid-template-columns: 1fr 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .year-badge { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Personal KPIs</h1>
    <p>Daily habits tracked monthly · goals shown as % achieved</p>
  </div>
  <div class="year-badge">2026</div>
</header>

<div class="summary-strip" id="summary-strip"></div>

<div class="section-title">Month by month</div>
<div class="months-grid" id="months-grid"></div>



<script src="data.js"></script>
<script>
  // ── helpers ──────────────────────────────────────────────
  const pct = (v, goal) => Math.round((v / goal) * 100);

  // Screen time: "goal" is a max; lower actual = better.
  // Score = 1 - (actual / cap), clamped 0–100.
  // E.g. actual 60 min vs 120 cap → 50% remaining = 100% goal met if ≤120.
  // We display how much UNDER the limit they are.
  const screenScore = (actual, cap) => {
    if (actual === null) return null;
    const raw = ((cap - actual) / cap) * 100;
    return Math.max(0, Math.min(200, Math.round(raw + 100))); // shift so "at goal" = 100%
    // simpler: % of cap used (lower is better → show inversion)
  };

  // Better simple version: score = cap/actual clamped to 200%.
  // 60/120 = 50% used → that's a 100% win; invert: show (cap/actual)*100 capped at 200.
  const screenPct = (actual, cap) => {
    if (actual === null) return null;
    return Math.min(200, Math.round((cap / actual) * 100));
  };

  const fmtMin = (mins) => {
    if (mins === null) return '—';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${h}h ${m.toString().padStart(2,'0')}m`;
  };

  const fmtSteps = (n) => n === null ? '—' : n.toLocaleString();

  // colour based on score
  const scoreColor = (score) => {
    if (score === null) return 'var(--muted)';
    if (score >= 90) return 'var(--hit)';
    if (score >= 60) return 'var(--progress)';
    return 'var(--miss)';
  };

  const barWidth = (score) => score === null ? 0 : Math.min(100, score);

  // ── build summary cards ──────────────────────────────────
  function buildSummary() {
    const complete = MONTHS.filter(m => m.status === 'complete' || m.status === 'in_progress');

    const avgStepsScore = Math.round(
      complete.filter(m => m.steps !== null)
              .reduce((s, m) => s + pct(m.steps, m.goal_steps), 0) /
      complete.filter(m => m.steps !== null).length
    );

    const avgScreenScore = Math.round(
      complete.filter(m => m.screen !== null)
              .reduce((s, m) => s + screenPct(m.screen, m.goal_screen), 0) /
      complete.filter(m => m.screen !== null).length
    );

    const avgVersesScore = Math.round(
      complete.filter(m => m.verses !== null)
              .reduce((s, m) => s + pct(m.verses, m.goal_verses), 0) /
      complete.filter(m => m.verses !== null).length
    );

    const sandMonths = complete.filter(m => m.sand !== null);
    const avgSandScore = sandMonths.length
      ? Math.round(sandMonths.reduce((s, m) => s + pct(m.sand, m.goal_sand), 0) / sandMonths.length)
      : null;

    const metrics = [
      { label: 'Avg Steps', score: avgStepsScore, color: 'var(--steps)', sub: 'goal: 10,000/day' },
      { label: 'Screen Time', score: avgScreenScore, color: 'var(--screen)', sub: 'goal: ≤2 hrs/day' },
      { label: 'Bible Verses', score: avgVersesScore, color: 'var(--verses)', sub: 'monthly target' },
      { label: 'Sand Hours', score: avgSandScore, color: 'var(--sand)', sub: 'goal: 8 hrs/day' },
    ];

    const strip = document.getElementById('summary-strip');
    metrics.forEach(m => {
      const c = document.createElement('div');
      c.className = 'summary-card';
      const displayScore = m.score === null ? '—' : `${Math.min(m.score, 999)}%`;
      const col = m.score === null ? 'var(--muted)' : scoreColor(m.score);
      c.innerHTML = `
        <div class="label">${m.label}</div>
        <div class="value" style="color:${col}">${displayScore}</div>
        <div class="sub">${m.sub} · YTD avg</div>
      `;
      strip.appendChild(c);
    });
  }

  // ── build month cards ────────────────────────────────────
  function buildMonths() {
    const grid = document.getElementById('months-grid');

    MONTHS.forEach(m => {
      const stepsScore  = m.steps  !== null ? pct(m.steps, m.goal_steps)       : null;
      const scrScore    = m.screen !== null ? screenPct(m.screen, m.goal_screen): null;
      const versesScore = m.verses !== null ? pct(m.verses, m.goal_verses)      : null;
      const sandScore   = m.sand   !== null ? pct(m.sand, m.goal_sand)          : null;

      const card = document.createElement('div');
      card.className = `month-card ${m.status}`;

      const kpis = [
        {
          name: 'Daily Steps',
          color: 'var(--steps)',
          score: stepsScore,
          raw: m.steps !== null
            ? `${fmtSteps(m.steps)} of ${fmtSteps(m.goal_steps)}`
            : 'no data',
        },
        {
          name: 'Screen Time',
          color: 'var(--screen)',
          score: scrScore,
          raw: m.screen !== null
            ? `${fmtMin(m.screen)} · cap ${fmtMin(m.goal_screen)}`
            : 'no data',
          inverted: true,
        },
        {
          name: 'Bible Verses',
          color: 'var(--verses)',
          score: versesScore,
          raw: m.verses !== null
            ? `${m.verses} of ${m.goal_verses}`
            : 'no data',
        },
        {
          name: 'Sand Hours',
          color: 'var(--sand)',
          score: sandScore,
          raw: m.sand !== null
            ? `${m.sand}h of ${m.goal_sand}h/day`
            : 'not tracked',
        },
      ];

      const kpiHTML = kpis.map(k => {
        const col = scoreColor(k.score);
        const displayPct = k.score === null
          ? '—'
          : k.inverted
            ? (k.score >= 100 ? `✓ under cap` : `${Math.round((1 - k.score/100)*100 + (k.score < 100 ? 100 - k.score : 0))}% over`)
            : `${Math.min(k.score, 999)}%`;

        const pctLabel = k.score === null ? '—'
          : k.inverted
            ? (k.score >= 100 ? `${Math.min(k.score, 200)}%` : `${k.score}%`)
            : `${Math.min(k.score, 999)}%`;

        return `
          <div class="kpi-row">
            <div class="kpi-top">
              <div class="kpi-name">
                ${k.name}${k.inverted ? ' ↓' : ''}
              </div>
              <div class="kpi-pct" style="color:${k.score !== null ? col : 'var(--muted)'}">
                ${pctLabel}
              </div>
            </div>
            <div class="kpi-bar-track">
              ${k.score !== null
                ? `<div class="kpi-bar-fill" style="width:${barWidth(k.score)}%;background:${col}"></div>`
                : `<div class="kpi-null"></div>`}
            </div>
            <div class="kpi-raw">${k.raw}</div>
          </div>
        `;
      }).join('');

      const statusLabel = { complete: 'Complete', in_progress: 'In progress', pending: 'Pending' }[m.status];

      card.innerHTML = `
        <div class="month-header">
          <div class="month-name">${m.label}</div>
          <div class="status-pill ${m.status}">${statusLabel}</div>
        </div>
        ${kpiHTML}
      `;

      grid.appendChild(card);
    });
  }

  buildSummary();
  buildMonths();
</script>
</body>
</html>
